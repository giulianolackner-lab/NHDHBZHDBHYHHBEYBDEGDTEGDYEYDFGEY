<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tung Tung Sahur 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
  #ui { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px; font-size: 13px; z-index: 10; }
</style>
</head>
<body>
<div id="ui">
  <b>🪵 TUNG TUNG SAHUR 3D</b><br>
  ZQSD / Flèches : Bouger | Espace : Sauter / Monter | Shift : Descendre<br>
  E : Entrer/Sortir véhicule | M : Vue 1ère / 3ème pers. | Clic : Souris & Batte
  <div id="st" style="color:#00ffcc;margin-top:5px;font-weight:bold;">À pied | 3ème pers.</div>
</div>

<script src="https://unpkg.com"></script>
<script>
if (typeof THREE === 'undefined') {
  document.body.innerHTML = '<h2 style="color:red;padding:20px;">Erreur : Connexion internet requise pour charger la 3D (Three.js).</h2>';
} else {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x87CEEB);
  s.fog = new THREE.FogExp2(0x87CEEB, 0.004);

  const cam = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
  const r = new THREE.WebGLRenderer({ antialias: true });
  r.setSize(innerWidth, innerHeight);
  r.shadowMap.enabled = true;
  document.body.appendChild(r.domElement);

  s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
  const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
  sun.position.set(80, 120, 80);
  sun.castShadow = true;
  s.add(sun);

  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x3b8c3b }));
  gnd.rotation.x = -Math.PI / 2;
  gnd.receiveShadow = true;
  s.add(gnd);

  const rd = new THREE.Mesh(new THREE.PlaneGeometry(20, 400), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  rd.rotation.x = -Math.PI / 2;
  rd.position.y = 0.05;
  s.add(rd);

  for (let i = 0; i < 60; i++) {
    let x = (Math.random() - 0.5) * 400, z = (Math.random() - 0.5) * 400;
    if (Math.abs(x) < 18) continue;
    let h = 10 + Math.random() * 30;
    let b = new THREE.Mesh(new THREE.BoxGeometry(10, h, 10), new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x8899aa : 0x226622 }));
    b.position.set(x, h / 2, z);
    b.castShadow = true;
    s.add(b);
  }

  // Tung Tung Sahur
  const p = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x9c6635 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.65, 2.6, 16), wood);
  body.position.y = 1.6;
  body.castShadow = true;
  p.add(body);

  [-0.22, 0.22].forEach(x => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    e.position.set(x, 2.3, -0.52);
    const u = new THREE.Mesh(new THREE.SphereGeometry(0.09), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    u.position.set(x, 2.3, -0.65);
    p.add(e, u);
  });

  const arm = new THREE.Group();
  arm.position.set(0.75, 1.9, 0);
  const bat = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.06, 1.6), new THREE.MeshStandardMaterial({ color: 0xd4a373 }));
  bat.position.set(0, -0.5, -0.8);
  bat.rotation.x = 1.4;
  arm.add(bat);
  p.add(arm);
  p.position.set(0, 0, 10);
  s.add(p);

  // Voiture
  const car = new THREE.Group();
  const cb = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 4.8), new THREE.MeshStandardMaterial({ color: 0xff2222 }));
  cb.position.y = 0.8;
  cb.castShadow = true;
  const cc = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 2.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
  cc.position.set(0, 1.5, 0.2);
  car.add(cb, cc);
  car.position.set(-5, 0, -5);
  s.add(car);

  // Avion
  const pl = new THREE.Group();
  const pf = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.5, 7, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  pf.rotation.x = Math.PI / 2;
  pf.position.y = 1.5;
  pf.castShadow = true;
  const pw = new THREE.Mesh(new THREE.BoxGeometry(10, 0.15, 1.8), new THREE.MeshStandardMaterial({ color: 0x0066ff }));
  pw.position.set(0, 1.6, -0.5);
  const pr = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  pr.position.set(0, 1.5, -3.6);
  pl.add(pf, pw, pr);
  pl.position.set(6, 0, -15);
  s.add(pl);

  let m = 'foot', fp = false, vy = 0, gr = true, cs = 0, ps = 0, yaw = 0, pit = 0.2, k = {};

  onkeydown = e => {
    k[e.code] = true;
    if (e.code === 'KeyM') { fp = !fp; ui(); }
    if (e.code === 'KeyE') {
      if (m === 'foot') {
        if (p.position.distanceTo(car.position) < 5) { m = 'car'; p.visible = false; }
        else if (p.position.distanceTo(pl.position) < 6) { m = 'plane'; p.visible = false; }
      } else {
        p.visible = true;
        p.position.copy(m === 'car' ? car.position : pl.position).add(new THREE.Vector3(3.5, 0, 0));
        if (p.position.y < 0) p.position.y = 0;
        m = 'foot';
      }
      ui();
    }
  };
  onkeyup = e => k[e.code] = false;
  onmousedown = () => {
    r.domElement.requestPointerLock();
    if (m === 'foot') { arm.rotation.x = 1.5; setTimeout(() => arm.rotation.x = 0, 200); }
  };
  onmousemove = e => {
    if (document.pointerLockElement === r.domElement) {
      yaw -= e.movementX * 0.003;
      pit = Math.max(-1.2, Math.min(1.2, pit - e.movementY * 0.003));
    }
  };
  onresize = () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); };
  function ui() { document.getElementById('st').innerText = `${m === 'foot' ? 'À pied' : m === 'car' ? 'Voiture' : 'Avion'} | ${fp ? '1ère pers.' : '3ème pers.'}`; }

  const clk = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const dt = clk.getDelta();
    if (m === 'foot') {
      let mz = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
      let mx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
      if (mz || mx) {
        let a = Math.atan2(mx, mz) + yaw;
        p.rotation.y = a;
        p.position.x -= Math.sin(a) * 10 * dt;
        p.position.z -= Math.cos(a) * 10 * dt;
      }
      if (k.Space && gr) { vy = 12; gr = false; }
      p.position.y += vy * dt;
      if (p.position.y > 0) vy -= 30 * dt; else { p.position.y = vy = 0; gr = true; }
    } else if (m === 'car') {
      cs = k.KeyW || k.ArrowUp ? Math.min(cs + 25 * dt, 45) : k.KeyS || k.ArrowDown ? Math.max(cs - 30 * dt, -15) : cs * 0.96;
      if (Math.abs(cs) > 0.5) car.rotation.y += (k.KeyA || k.ArrowLeft ? 1 : k.KeyD || k.ArrowRight ? -1 : 0) * 2.2 * dt * (cs > 0 ? 1 : -1);
      car.position.x -= Math.sin(car.rotation.y) * cs * dt;
      car.position.z -= Math.cos(car.rotation.y) * cs * dt;
      p.position.copy(car.position);
    } else {
      pr.rotation.z += 25 * dt;
      if (k.KeyW || k.ArrowUp) ps = Math.min(ps + 20 * dt, 65);
      if (k.KeyS || k.ArrowDown) ps = Math.max(ps - 15 * dt, 0);
      if (k.KeyA || k.ArrowLeft) pl.rotation.y += 1.5 * dt;
      if (k.KeyD || k.ArrowRight) pl.rotation.y -= 1.5 * dt;
      if (k.Space && ps > 15) pl.position.y += 15 * dt;
      else if (k.ShiftLeft && pl.position.y > 0) pl.position.y = Math.max(0, pl.position.y - 15 * dt);
      pl.position.x -= Math.sin(pl.rotation.y) * ps * dt;
      pl.position.z -= Math.cos(pl.rotation.y) * ps * dt;
      p.position.copy(pl.position);
    }

    const t = m === 'foot' ? p : m === 'car' ? car : pl;
    if (fp) {
      cam.position.copy(t.position).add(new THREE.Vector3(0, m === 'foot' ? 2.3 : 1.8, 0));
      if (m === 'foot') { p.visible = false; cam.rotation.order = 'YXZ'; cam.rotation.y = yaw; cam.rotation.x = pit; }
      else cam.rotation.copy(t.rotation);
    } else {
      if (m === 'foot') {
        p.visible = true;
        cam.position.set(t.position.x + Math.sin(yaw) * 6, t.position.y + 3 + Math.sin(pit) * 3, t.position.z + Math.cos(yaw) * 6);
        cam.lookAt(t.position.clone().add(new THREE.Vector3(0, 1.8, 0)));
      } else {
        let o = new THREE.Vector3(0, 4, m === 'plane' ? 14 : 9).applyQuaternion(t.quaternion);
        cam.position.lerp(t.position.clone().add(o), 0.15);
        cam.lookAt(t.position);
      }
    }
    r.render(s, cam);
  }
  loop();
}
</script>
</body>
</html>
